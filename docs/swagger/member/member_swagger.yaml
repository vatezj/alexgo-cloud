basePath: /api
info:
  contact: {}
  description: |-
    alexGo-cloud 后端 member 模块 API 文档（swaggo 生成，`make swagger` 刷新）。
    admin 侧（/admin/**）统一 pkg/resp 信封 {code,msg,data}；app 契约侧为裸 JSON 无信封。
  title: alexGo-cloud member API
  version: "1.0"
paths:
  /admin/member/users:
    get:
      description: 权限 member:user；当前租户会员 → 统一分页信封 data:{list,total,page,size}。
      parameters:
      - description: 页码，默认 1
        example: 1
        in: query
        name: page
        type: integer
      - description: 每页条数，默认 10
        example: 10
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      summary: 会员分页
      tags:
      - member-admin
  /admin/member/users/{id}/status:
    put:
      consumes:
      - application/json
      description: 权限 member:user；status 指针 bind——缺字段或值 ∉ {0,1} 一律 400（无"空 body 默认停用"）。
      parameters:
      - description: 会员行 id
        in: path
        name: id
        required: true
        type: integer
      - description: 启停状态
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      summary: 启用/停用会员
      tags:
      - member-admin
  /admin/member/users/export:
    get:
      description: 权限 member:user；当前租户全量会员 Excel（ID/昵称/手机/状态/IP/时间）。Content-Disposition
        附件下载。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: file
      security:
      - Bearer: []
      summary: 导出全量会员 xlsx
      tags:
      - member-admin
  /app/member/auth/login:
    post:
      consumes:
      - application/json
      description: 统一登录（account_type=member，client=alexgo-app），带 captcha 两段。data={token,refresh_token,expires_in}。失败：captcha
        拒 → 400/30005；签发/装配故障 → 503/50000；其余 401/20001 固定文案（防枚举）。免鉴权。
      parameters:
      - description: 登录信息
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties: true
            type: object
      summary: 会员登录（公开）
      tags:
      - member-app
  /app/member/auth/logout:
    post:
      description: possession-based：凭 Authorization 头的 access token 自行撤销，无须登录态中间件（I1）。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      summary: 注销当前 access token
      tags:
      - member-app
  /app/member/auth/refresh:
    post:
      consumes:
      - application/json
      description: possession-based：凭 body 里的 refresh_token 刷新，无须登录态中间件（access 过期正是刷新场景）。失败
        401。免 X-Session。
      parameters:
      - description: 刷新令牌
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: 刷新令牌
      tags:
      - member-app
  /app/member/auth/register:
    post:
      consumes:
      - application/json
      description: body {mobile,password,nickname}；查重 → 30009、字段校验 → 10001。响应 pkg/resp
        信封，data 为会员行。免鉴权。
      parameters:
      - description: 注册信息
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: 会员注册（公开）
      tags:
      - member-app
  /app/member/me:
    get:
      description: 凭 Authorization Bearer 自鉴权（member 身份校验，非 X-Session）。data 键名 user_id/nickname/avatar/created_at
        逐字（小程序前端消费面）。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      summary: 当前登录会员资料
      tags:
      - member-app
    put:
      consumes:
      - application/json
      description: 凭 Bearer 自鉴权。指针字段缺省 nil=不改；nickname 空串 → 10001；avatar 空串=清空（合法）。
      parameters:
      - description: 要改的字段（可只给一项）
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      summary: 部分更新会员资料
      tags:
      - member-app
securityDefinitions:
  Bearer:
    description: admin 侧统一登录令牌，格式 `Bearer <token>`。
    in: header
    name: Authorization
    type: apiKey
  X-Session:
    description: app 契约侧自鉴权会话令牌（登录接口签发）。
    in: header
    name: X-Session
    type: apiKey
swagger: "2.0"
