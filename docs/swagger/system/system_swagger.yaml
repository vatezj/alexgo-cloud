          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      summary: 新建系统配置
      tags:
      - system-admin
    put:
      consumes:
      - application/json
      description: 权限 system:config；无 :id 路径参数，目标 ID 在 body 内。统一 pkg/resp 信封。
      parameters:
      - description: 系统配置（含 ID）
