  /app/system/auth/login:
    post:
      consumes:
      - application/json
      description: 免鉴权（自鉴权入口）；统一 pkg/resp 信封。验证码错 → CodeCaptchaInvalid；其余失败透传 → 50000（怪癖保留：除
        captcha 外一律 HTTP 500，既有前端契约）。data={token,refresh_token,expires_in}。
      parameters:
      - description: 登录参数
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: app 端登录（用户名密码 + 图形验证码）
      tags:
      - system-app
  /app/system/auth/logout:
    post:
      description: 从 Authorization 头取 Bearer token 后吊销；缺失 → CodeParamMissing。同一 handler
        挂 admin 与 app 两侧。统一 pkg/resp 信封。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      summary: 注销当前 access token
      tags:
      - system-admin
      - system-app
  /app/system/auth/refresh:
    post:
      consumes:
      - application/json
      description: 凭 body refresh_token 换新令牌对（凭据即 token，无需 Authorization）；缺失 → CodeParamMissing，无效
        → 401。同一 handler 挂 admin 与 app 两侧。统一 pkg/resp 信封。
      parameters:
      - description: refresh_token
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: 刷新令牌
      tags:
      - system-admin
      - system-app
securityDefinitions:
  Bearer:
    description: admin 侧统一登录令牌，格式 `Bearer <token>`。
    in: header
    name: Authorization
    type: apiKey
  X-Session:
    description: app 契约侧自鉴权会话令牌（登录接口签发）。
    in: header
    name: X-Session
    type: apiKey
swagger: "2.0"
