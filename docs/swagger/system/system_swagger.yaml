      tenant_id:
        type: integer
      updated_at:
        type: string
      value:
        type: string
    type: object
  model.SystemNotice:
    properties:
      attachments:
        description: |-
          Attachments 附件 JSON 数组文本（元素 {id,name,size,url}，url=/api/public/infra/file/<key>）。
          照 DataScopeDeptIDs 的 string 惯例（spec §2）：后端原样存取不解析——
          公告内容本就是 admin 受信富文本。size 4096 防 MySQL 默认 varchar(191) 截断。
        type: string
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
      status:
        type: integer
      tenant_id:
        type: integer
      title:
        type: string
      updated_at:
        type: string
    type: object
info:
  contact: {}
  description: |-
    alexGo-cloud 后端 system 模块 API 文档（swaggo 生成，`make swagger` 刷新）。
    admin 侧（/admin/**）统一 pkg/resp 信封 {code,msg,data}；app 契约侧为裸 JSON 无信封。
  title: alexGo-cloud system API
  version: "1.0"
paths:
  /admin/system/auth/logout:
    post:
      description: 从 Authorization 头取 Bearer token 后吊销；缺失 → CodeParamMissing。同一 handler
        挂 admin 与 app 两侧。统一 pkg/resp 信封。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      summary: 注销当前 access token
      tags:
      - system-admin
      - system-app
  /admin/system/auth/profile:
    get:
      description: 登录即可（system:auth）；返回 claims + 角色码 + 权限码 + 菜单/路由树。统一 pkg/resp 信封。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      summary: 当前登录用户资料
      tags:
      - system-admin
  /admin/system/auth/refresh:
    post:
      consumes:
      - application/json
      description: 凭 body refresh_token 换新令牌对（凭据即 token，无需 Authorization）；缺失 → CodeParamMissing，无效
        → 401。同一 handler 挂 admin 与 app 两侧。统一 pkg/resp 信封。
      parameters:
      - description: refresh_token
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: 刷新令牌
      tags:
      - system-admin
      - system-app
  /admin/system/configs:
    get:
      description: 权限 system:config；当前租户全量配置，无分页。统一 pkg/resp 信封。
      produces:
      - application/json
