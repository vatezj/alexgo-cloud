basePath: /api
info:
  contact: {}
  description: |-
    alexGo-cloud 后端 system 模块 API 文档（swaggo 生成，`make swagger` 刷新）。
    admin 侧（/admin/**）统一 pkg/resp 信封 {code,msg,data}；app 契约侧为裸 JSON 无信封。
  title: alexGo-cloud system API
  version: "1.0"
paths:
  /admin/system/online:
    get:
      description: 权限 system:online；本租户未过期管理员会话，统一 pkg/resp 信封。明文 token 不出接口。
      parameters:
      - description: 页码，默认 1
        example: 1
        in: query
        name: page
        type: integer
      - description: 每页条数，默认 10
        example: 10
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      summary: 在线管理员会话分页
      tags:
      - system-admin
  /admin/system/online/{id}:
    delete:
      description: 权限 system:online；按会话行 id 吊销，明文 token 不出接口；禁踢自己。
      parameters:
      - description: 会话行 id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      summary: 踢下线（按行吊销会话）
      tags:
      - system-admin
  /admin/system/online/impersonate:
    post:
      consumes:
      - application/json
      description: 权限 system:online；签发会员侧会话（client_id=impersonate-admin），写审计。data={access_token,
        refresh_token, expires_in}。
      parameters:
      - description: 目标会员
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      summary: 代登录到会员
      tags:
      - system-admin
securityDefinitions:
  Bearer:
    description: admin 侧统一登录令牌，格式 `Bearer <token>`。
    in: header
    name: Authorization
    type: apiKey
  X-Session:
    description: app 契约侧自鉴权会话令牌（登录接口签发）。
    in: header
    name: X-Session
    type: apiKey
swagger: "2.0"
