basePath: /api
info:
  contact: {}
  description: |-
    alexGo-cloud 后端 order 模块 API 文档（swaggo 生成，`make swagger` 刷新）。
    admin 侧（/admin/**）统一 pkg/resp 信封 {code,msg,data}；app 契约侧为裸 JSON 无信封。
  title: alexGo-cloud order API
  version: "1.0"
paths:
  /admin/order/orders:
    get:
      description: 权限 order:order；无 page/size 入参，data 为订单数组（不顺手加分页）。租户隔离在 repo 层（user_id
        → system_users.tenant_id）。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      summary: 订单全量列表
      tags:
      - order-admin
    post:
      consumes:
      - application/json
      description: 权限 order:order；body 全字段平铺（user_id/product_id/amount 分/状态/订单号）。成功
        data 为 null。
      parameters:
      - description: 订单信息
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      summary: 创建订单
      tags:
      - order-admin
  /admin/order/orders/export:
    get:
      description: 权限 order:order；当前租户全量订单 Excel（ID/订单号/用户/产品/金额分/状态/时间）。Content-Disposition
        附件下载。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: file
      security:
      - Bearer: []
      summary: 导出全量订单 xlsx
      tags:
      - order-admin
securityDefinitions:
  Bearer:
    description: admin 侧统一登录令牌，格式 `Bearer <token>`。
    in: header
    name: Authorization
    type: apiKey
  X-Session:
    description: app 契约侧自鉴权会话令牌（登录接口签发）。
    in: header
    name: X-Session
    type: apiKey
swagger: "2.0"
