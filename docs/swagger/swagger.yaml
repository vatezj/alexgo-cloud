basePath: /api
info:
  contact: {}
  description: |-
    alexGo-cloud 后端 API 文档（swaggo 生成，`make swagger` 刷新）。
    两侧响应约定不同：admin 侧（/admin/**）统一 pkg/resp 信封；app 契约侧（/v1/**）为裸 JSON 无信封。
    tag 命名 = 模块-侧（如 fishgame-admin / fishgame-app），UI 侧栏按 后台管理 / App 端 两组分——详见 docs/swagger-guide.md。
  title: alexGo-cloud API
  version: "1.0"
paths: {}
securityDefinitions:
  Bearer:
    description: admin 侧统一登录令牌，格式 `Bearer <token>`。
    in: header
    name: Authorization
    type: apiKey
  X-Session:
    description: app 契约侧自鉴权会话令牌（/auth/login 签发）。
    in: header
    name: X-Session
    type: apiKey
swagger: "2.0"
