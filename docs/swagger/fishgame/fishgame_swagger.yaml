basePath: /api
definitions:
  service.ConfigInput:
    properties:
      depth_bias:
        type: number
      end_at:
        type: string
      fish_id:
        type: string
      period:
        type: string
      start_at:
        type: string
      status:
        type: integer
      type:
        type: string
      week:
        type: string
    type: object
  service.DailyConfigResponse:
    properties:
      fish_king:
        properties:
          fish_id:
            type: string
          week:
            type: string
        type: object
      luck:
        properties:
          depth_bias:
            type: number
          period:
            type: string
        type: object
    type: object
  service.DailyStat:
    properties:
      count:
        type: integer
      day:
        type: string
      name:
        type: string
    type: object
  service.FishInput:
    properties:
      depth:
        type: string
      fish_id:
        type: string
      flavor:
        type: string
      icon:
        description: JSON {"shape","color","accent"}，透传不校验（客户端归一兜底）
        type: string
      name:
        type: string
      period:
        type: string
      rarity:
        type: string
      sort:
        type: integer
      status:
        type: integer
    type: object
  service.StatsOut:
    properties:
      ad_count:
        type: integer
      basket_count:
        type: integer
      daily:
        description: 按日趋势（day asc, name asc）
        items:
          $ref: '#/definitions/service.DailyStat'
        type: array
      event_counts:
        additionalProperties:
          format: int64
          type: integer
        description: 近 7 日按 name
        type: object
      funnel:
        additionalProperties:
          format: int64
          type: integer
        description: catch/empty/escape/broken
        type: object
      funnel_ratio:
        additionalProperties:
          format: float64
          type: number
        description: 各结果 / 四类合计
        type: object
      player_today:
        type: integer
      player_total:
        type: integer
      sign_count:
        type: integer
    type: object
info:
  contact: {}
  description: |-
    alexGo-cloud 后端 fishgame 模块 API 文档（swaggo 生成，`make swagger` 刷新）。
    admin 侧（/admin/**）统一 pkg/resp 信封 {code,msg,data}；app 契约侧为裸 JSON 无信封。
  title: alexGo-cloud fishgame API
  version: "1.0"
paths:
  /admin/fishgame/configs:
    get:
      description: 权限 fishgame:config；type 空不过滤（luck|fish_king）。
      parameters:
      - description: 页码
        example: 1
        in: query
        name: page
        type: integer
      - description: 每页条数
        example: 10
        in: query
        name: size
        type: integer
      - description: luck|fish_king，空不过滤
        example: fish_king
        in: query
        name: type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      summary: 运营覆盖分页
      tags:
      - fishgame-admin
    post:
      consumes:
      - application/json
      description: 权限 fishgame:config；luck 校验 period/depth_bias≤0.3；fish_king 的 fish_id
        必须表内启用（30403）且 week 必填。
      parameters:
      - description: 运营覆盖
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service.ConfigInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      summary: 新建运营覆盖
      tags:
      - fishgame-admin
  /admin/fishgame/configs/{id}:
    delete:
      description: 权限 fishgame:config；查无 → 30404。
      parameters:
      - description: 行 id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      summary: 删除运营覆盖
      tags:
      - fishgame-admin
    put:
      consumes:
      - application/json
      description: 权限 fishgame:config；查无 → 30404；校验同新建。
      parameters:
      - description: 行 id
        in: path
        name: id
        required: true
        type: integer
      - description: 运营覆盖
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service.ConfigInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      summary: 更新运营覆盖（含启停）
      tags:
      - fishgame-admin
  /admin/fishgame/events:
    get:
      description: 权限 fishgame:event；name/player_id/起止时间（客户端本地 epoch 秒）筛选，id 倒序。
      parameters:
      - description: 页码
        example: 1
        in: query
        name: page
        type: integer
      - description: 每页条数
        example: 10
        in: query
        name: size
        type: integer
      - description: 事件名，如 catch/sign_in
        example: catch
        in: query
        name: name
        type: string
      - description: 玩家行 id
        example: 1
        in: query
        name: player_id
        type: integer
      - description: 起（含）unix 秒
        example: 1760600000
        in: query
        name: start_t
        type: integer
      - description: 止（含）unix 秒
        example: 1761200000
        in: query
        name: end_t
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      summary: 埋点事件分页
      tags:
      - fishgame-admin
  /admin/fishgame/fishes:
    get:
      description: 权限 fishgame:fish；统一 pkg/resp 信封。rarity 空不过滤，status 缺省 -1 不过滤。
      parameters:
      - description: 页码，默认 1
        example: 1
        in: query
        name: page
        type: integer
      - description: 每页条数，默认 10
        example: 10
        in: query
        name: size
        type: integer
      - description: normal|misc|rare|epic，空不过滤
        example: rare
        in: query
        name: rarity
        type: string
      - description: 0 停用 1 启用，缺省 -1 不过滤
        example: 1
        in: query
        name: status
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      summary: 图鉴条目分页
      tags:
      - fishgame-admin
    post:
      consumes:
      - application/json
      description: 权限 fishgame:fish；fish_id 查重（30401）+ rarity/period/depth 枚举校验（10001）。
      parameters:
      - description: 图鉴条目
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service.FishInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      summary: 新建图鉴条目
      tags:
      - fishgame-admin
  /admin/fishgame/fishes/{id}:
    delete:
      description: 权限 fishgame:fish；被 dex/事件引用 → 30402（改启停即可）；查无 → 30401。
      parameters:
      - description: 行 id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      summary: 删除图鉴条目
      tags:
      - fishgame-admin
    put:
      consumes:
      - application/json
      description: 权限 fishgame:fish；查无 → 30401；枚举校验同新建。
      parameters:
      - description: 行 id
        in: path
        name: id
        required: true
        type: integer
      - description: 图鉴条目
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service.FishInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      summary: 更新图鉴条目（含启停）
      tags:
      - fishgame-admin
  /admin/fishgame/players:
    get:
      description: 权限 fishgame:player；openid/nick 模糊 + 行内点亮数（只聚合当页）。
      parameters:
      - description: 页码
        example: 1
        in: query
        name: page
        type: integer
      - description: 每页条数
        example: 10
        in: query
        name: size
        type: integer
      - description: openid/nick 模糊
        example: 阿
        in: query
        name: keyword
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      summary: 玩家分页
      tags:
      - fishgame-admin
  /admin/fishgame/players/{id}:
    get:
      description: 权限 fishgame:player；基本 + 点亮明细（count≥1）+ 最近 20 事件；查无 → 30002。
      parameters:
      - description: 玩家行 id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      summary: 玩家详情
      tags:
      - fishgame-admin
  /admin/fishgame/players/{id}/rank:
    get:
      description: 权限 fishgame:player；复用好友榜双口径找本人位置（客服排查用）。
      parameters:
      - description: 玩家行 id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      summary: 玩家榜单位次
      tags:
      - fishgame-admin
  /admin/fishgame/stats:
    get:
      description: 权限 fishgame:stats；玩家总量/今日新增、事件计数、按日趋势、钓鱼漏斗（catch/empty/escape/broken）、签到/茶篓/广告计数。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.StatsOut'
      security:
      - Bearer: []
      summary: 运营看板聚合（近 7 日）
      tags:
      - fishgame-admin
  /public/fishgame/share/{key}:
    get:
      description: '按 key 直出图片字节（Content-Disposition: inline）；miss 404 {"error":"not_found"}。'
      parameters:
      - description: 上传返回 URL 中的 key
        in: path
        name: key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: file
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 分享图公开读（免鉴权）
      tags:
      - fishgame-app
  /v1/auth/login:
    post:
      consumes:
      - application/json
      description: body {"code":"..."} → {"session":"..."}；失败 401 {"error":"login_failed"}。免
        X-Session（自鉴权入口，全裸 JSON 无 pkg/resp 信封）。
      parameters:
      - description: 微信登录 code
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 游戏端登录（微信 code 换会话）
      tags:
      - fishgame-app
  /v1/basket:
    get:
      description: elapsed = now-since → bait=min(elapsed/2400,12)，elapsed≥8h 时 capped=true；since
        缺省为服务端当前时刻。
      parameters:
      - description: 客户端本地起算点（unix 秒）
        example: 1761200000
        in: query
        name: since
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - X-Session: []
      summary: 茶篓产出（纯计算，不落表）
      tags:
      - fishgame-app
  /v1/config/daily:
    get:
      description: 运营覆盖优先，否则确定性自算；响应 {"luck":{"period","depth_bias"},"fish_king":{"fish_id","week"}}。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.DailyConfigResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - X-Session: []
      summary: 每日配置（运势 + 鱼王）
      tags:
      - fishgame-app
  /v1/daily/sign:
    post:
      consumes:
      - application/json
      description: streak 作对账参考，服务端权威计算连击；同日重复 {"ok":false}；date 必须 YYYY-MM-DD。
      parameters:
      - description: 签到请求
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - X-Session: []
      summary: 每日签到
      tags:
      - fishgame-app
  /v1/dex:
    get:
      description: 响应 {"dex":{"<fish_id>":N}}，与 dex/report 请求体对称；新玩家 {}。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - X-Session: []
      summary: 图鉴进度拉取（换设备恢复）
      tags:
      - fishgame-app
  /v1/dex/report:
    post:
      consumes:
      - application/json
      description: body {"dex":{"<fish_id>":N}}；服务端双路合并取 max（非 sum），响应 {"ok":true,"dex":总数}。
      parameters:
      - description: 点亮镜像
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - X-Session: []
      summary: 图鉴进度上报（客户端镜像对账）
      tags:
      - fishgame-app
  /v1/dex/table:
    get:
      description: 响应 {"list":[{id,name,rarity,period,depth,flavor,icon}]}，仅 status=1；icon
        为 JSON 串 {"shape","color","accent"}，缺省=客户端默认图标。客户端登录链第一步拉取，合并进本地 FishDB（离线保底：内置表始终可用）。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - X-Session: []
      summary: 图鉴表（只发启用条目）
      tags:
      - fishgame-app
  /v1/friends:
    post:
      consumes:
      - application/json
      description: 自身 → self_friend；目标不存在 → target_not_found；成功 {"ok":true}。
      parameters:
      - description: 目标玩家
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - X-Session: []
      summary: 添加好友（按 openid）
      tags:
      - fishgame-app
  /v1/friends/rank:
    get:
      description: 好友源非空 → 好友 ∪ 自己；空 → 同租户全体；dex 降序、nick 升序决胜。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - X-Session: []
      summary: 好友榜（双口径）
      tags:
      - fishgame-app
  /v1/share/image:
    post:
      consumes:
      - multipart/form-data
      description: multipart 字段 image；扩展名白名单（jpeg 归一存 jpg）；≤2MB。URL base 优先级：cfg.Fishgame.PublicBaseURL
        → https+Host。
      parameters:
      - description: 分享图（jpg/png/jpeg）
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - X-Session: []
      summary: 分享图上传
      tags:
      - fishgame-app
  /v1/track:
    post:
      consumes:
      - application/json
      description: 单条非法跳过、整批非法仍 204（契约只认 2xx）；dedup_key=sha1(openid|name|t|canonical
        JSON) 幂等。catch 事件驱动图鉴点亮。
      parameters:
      - description: 事件批次
        in: body
        name: body
        required: true
        schema:
          type: object
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - X-Session: []
      summary: 埋点上报（批量）
      tags:
      - fishgame-app
securityDefinitions:
  Bearer:
    description: admin 侧统一登录令牌，格式 `Bearer <token>`。
    in: header
    name: Authorization
    type: apiKey
  X-Session:
    description: app 契约侧自鉴权会话令牌（登录接口签发）。
    in: header
    name: X-Session
    type: apiKey
swagger: "2.0"
