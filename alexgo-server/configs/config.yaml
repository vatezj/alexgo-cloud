server:
  http_addr: ":9090"
  grpc_addr: ":50051"
  pprof_enabled: true

database:
  dsn: "alexgo-cloud:caMYe2mB3jpEerbY@tcp(81.71.152.135:3399)/alexgo-cloud?charset=utf8mb4&parseTime=True&loc=Local"

migrate:
  auto: true

microservice:
  enabled: false
  registry: "consul://127.0.0.1:8500"

mq:
  nats:
    enabled: false
    url: "nats://127.0.0.1:4222"
    stream: "ALEXGO"
    subject_prefix: "alexgo.>"

outbox:
  enabled: true
  interval_second: 5
  batch_size: 100

redis:
  enabled: false
  addr: "127.0.0.1:6379"
  password: ""
  db: 0

limiter:
  enabled: false
  rate: 100
  burst: 200

breaker:
  enabled: false
  threshold: 10
  open_second: 30

modules:
  system: true
  order: true
  scorecard: true
  fishgame: true
  starfuyu: true
  taokouling: true

jobs:                          # job 覆盖表（pkg/job）：嵌套 模块→任务名→表达式；缺键=代码缺省，空串=停用
  system:
    sweep_tokens: "@every 1h"
  scorecard:
    sweep_rooms: "@every 1m"
  starfuyu:
    fetch_fortune: "10 0 * * *"
    generate_images: "20 0 * * *"
    upload_draft: "10 17 * * *"     # 每天 17:10 出次日软文草稿（单数日粉底图/双数日橙底图）

fishgame:
  wechat:
    appid: "wx585e3bf6bd2c5b46"             # 小游戏 appid（联调时填）
    secret: ""            # 小游戏 secret
  public_base_url: ""     # 空 = 由请求 Host + https 拼接（share/image 的 url）
  test_accounts: [alice, bob]   # 编辑器测试账号名单（名单即账号，test_login 首登自动建号）
  test_login_secret: ""   # test_login 共享密钥（客户端 fishgame/test_secret 对齐）

scorecard:
  wxacode_env_version: "release"  # 小程序码 env_version：trial=体验版（默认）/ release=正式版 / develop=开发版；正式发版改 release

storage:
  root: ./data/uploads        # 盘根，驱动构造时 MkdirAll
  max_size_mb: 10             # 单文件上限
  # allowed_exts: [jpg, jpeg, png, gif, webp, pdf, zip, xlsx]  # 省略则用内置白名单

starfuyu:
  deepseek:
    api_key: "" # DeepSeek API Key
    base_url: "https://api.deepseek.com/v1/chat/completions"
    model: "deepseek-chat"
    timeout: 120              # 秒，<=0 取 120
    max_retries: 3            # <=0 取 3
    retry_delay: 2            # 秒，<=0 取 2
  wechat_mp:                  # 公众号（草稿箱上传）
    app_id: "wxf9681a9cd494c0f4" # 微信小程序AppID
    app_secret: "" # 微信小程序AppSecret
  limits:
    bazi_calculate_daily: 5   # <=0 取 5
    divination_draw_daily: 10 # <=0 取 10
  assets_dir: "modules/starfuyu/assets"   # legacy 回退根（底图/字体均走独立配置，不放源码树）
  font_file: "./data/fonts/AlibabaPuHuiTi-3-85-Bold.ttf"   # 运势图字体（运行时目录，源码树外）；空串=回退 assets/fonts 字典序首个
  bg_file: "./data/starfuyu/bg.png"       # 分享卡底图 1728×2397（可替换模板，源码树外）；空串=回退 assets/bgimage/bg.png
  cover_dir: "./data/starfuyu/cover"    # 软文封面目录（{date}.png 合成封面，scripts/starfuyu_cover.py 产出）；缺失回退海报
  cute_dir: "./data/starfuyu/cute/cutout" # 角色抠图目录（12 张透明 PNG，scripts/starfuyu_cutout.py 产出）；空串=渲染 30502 不回退

taokouling:
  zhetaoke:
    appkey: ""             # 凭据提交空串（密钥不进 git），部署期 env TAOKOULING_ZHETAKE_APPKEY 注入
    sid: "21649"
    parse_pid: "mm_106702626_354300208_99225400058"
    base_url: "https://api.zhetaoke.com:10001"
    timeout: 5
    max_retries: 1
  haodanku:
    base_url: "http://v2.api.haodanku.com"
    timeout: 5
    max_retries: 1
  top:
    appkey: "25922261"
    secret: ""             # 凭据提交空串，部署期 env TAOKOULING_TOP_SECRET 注入
    user_id: "1060631727"
    base_url: "https://eco.taobao.com/router/rest"
    timeout: 5
    max_retries: 1
  shorturl:
    base_url: "http://api.ft12.com/api.php"
    apikey: ""             # 凭据提交空串，部署期 env TAOKOULING_SHORTURL_APIKEY 注入
    timeout: 3
  fallback_search_url: ""
  rebate_rate: 0.05
  rebate_tutorial_url: ""
  rate_limit:
    enabled: true
    limit: 10
    window_seconds: 60
  cache_enabled: true
  cache_ttl_seconds: 1800
