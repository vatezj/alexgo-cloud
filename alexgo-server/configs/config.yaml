server:
  http_addr: ":9090"
  grpc_addr: ":50051"
  pprof_enabled: true

database:
  dsn: "alexgo-cloud:caMYe2mB3jpEerbY@tcp(81.71.152.135:3399)/alexgo-cloud?charset=utf8mb4&parseTime=True&loc=Local"

migrate:
  auto: true

microservice:
  enabled: false
  registry: "consul://127.0.0.1:8500"

mq:
  nats:
    enabled: false
    url: "nats://127.0.0.1:4222"
    stream: "ALEXGO"
    subject_prefix: "alexgo.>"

outbox:
  enabled: true
  interval_second: 5
  batch_size: 100

redis:
  enabled: false
  addr: "127.0.0.1:6379"
  password: ""
  db: 0

limiter:
  enabled: false
  rate: 100
  burst: 200

breaker:
  enabled: false
  threshold: 10
  open_second: 30

modules:
  system: true
  order: true
  scorecard: true
  fishgame: true

fishgame:
  wechat:
    appid: ""             # 小游戏 appid（联调时填）
    secret: ""            # 小游戏 secret
  public_base_url: ""     # 空 = 由请求 Host + https 拼接（share/image 的 url）

scorecard:
  wxacode_env_version: "trial"  # 小程序码 env_version：trial=体验版（默认）/ release=正式版 / develop=开发版；正式发版改 release

storage:
  root: ./data/uploads        # 盘根，驱动构造时 MkdirAll
  max_size_mb: 10             # 单文件上限
  # allowed_exts: [jpg, jpeg, png, gif, webp, pdf, zip, xlsx]  # 省略则用内置白名单
