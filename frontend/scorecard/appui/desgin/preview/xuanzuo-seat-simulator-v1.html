:root{
  --ink-900:#14120F;
  --ink-700:#1E1B17;
  --ink-600:#2A2722;
  --tile:#F2EDE3;
  --jet:#2A2722;
  --brass:#C9A24B;
  --vermillion:#D23B22;
  --red-deep:#B32D18;
  --jade:#3E7D5A;
  --fg:#EDE6D8;
  --muted:#9B917F;
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong",serif;
  --sans:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --num:"Oswald","DIN Alternate","Helvetica Neue",sans-serif;
  --tile-shadow:0 2px 0 rgba(0,0,0,.5),0 10px 24px rgba(0,0,0,.45);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{
  min-height:100vh;
  background:oklch(from var(--ink-900) calc(l - 0.05) c h);
  font-family:var(--sans);
  color:var(--fg);
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:24px 16px;
  -webkit-font-smoothing:antialiased;
}

/* ── 画布 390×844 ─────────────────────────── */
.screen{
  width:390px;height:844px;flex:none;margin:auto;
  background:var(--ink-900);
  position:relative;overflow:hidden;
  display:flex;flex-direction:column;
  border:1px solid rgba(237,230,216,.07);
  box-shadow:0 30px 90px rgba(0,0,0,.6);
}

/* ── 状态栏 44 ─────────────────────────────── */
.statusbar{
  height:44px;flex:none;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px 0 26px;color:var(--fg);
}
.statusbar .time{
  font:600 15px/1 -apple-system,"SF Pro Text","Helvetica Neue",sans-serif;
  letter-spacing:.02em;
}
.statusbar .sys{display:flex;align-items:center;gap:6px;}
.statusbar svg{display:block;}

/* ── 顶栏 ──────────────────────────────────── */
.nav{
  height:60px;flex:none;
  display:flex;align-items:center;
  padding:0 16px 0 8px;
}
.nav-back{
  width:44px;height:44px;flex:none;
  display:grid;place-items:center;
  background:none;border:0;border-radius:12px;
  color:var(--fg);cursor:pointer;
}
.nav-back:active{background:rgba(237,230,216,.08);}
.nav-back:focus-visible{outline:2px solid var(--brass);outline-offset:2px;}
.nav-back svg{width:22px;height:22px;}
.nav-titles{flex:1;min-width:0;margin-left:2px;}
.nav-titles h1{
  font:700 18px/1.3 var(--serif);
  letter-spacing:.02em;color:var(--fg);
}
.nav-titles p{
  font:400 11px/1.4 var(--sans);
  color:var(--muted);margin-top:2px;
}
.capsule{
  width:87px;height:32px;flex:none;
  border-radius:999px;
  background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.13);
  display:flex;align-items:center;
  color:var(--fg);
}
.cap-half{flex:1;display:grid;place-items:center;height:100%;}
.cap-sep{width:1px;height:18px;background:rgba(255,255,255,.16);}
.dots{display:flex;gap:3.5px;}
.dots i{width:3.5px;height:3.5px;border-radius:50%;background:currentColor;display:block;}

/* ── 主区 ──────────────────────────────────── */
.main{
  flex:1;min-height:0;
  display:flex;flex-direction:column;
  padding:6px 20px 0;
}

/* ── 俯视麻将桌（视觉主角） ────────────────── */
.hero{
  flex:1;min-height:0;
  display:flex;align-items:center;justify-content:center;
}
.table{
  width:300px;height:300px;flex:none;
  position:relative;
  background:var(--ink-600);
  border-radius:20px;
  padding:8px;
  box-shadow:var(--tile-shadow);
}
.felt{
  position:relative;width:100%;height:100%;
  background:var(--ink-700);
  border-radius:14px;
  box-shadow:inset 0 2px 10px rgba(0,0,0,.45),inset 0 0 0 1px rgba(0,0,0,.35);
}
/* 牌墙：四面骨白细排（低透明度实体感） */
.wall{position:absolute;display:flex;gap:4px;justify-content:center;}
.wall i{display:block;background:rgba(242,237,227,.13);border-radius:2px;}
.wall-h{left:56px;right:56px;}
.wall-h.top{top:40px;}
.wall-h.bottom{bottom:40px;}
.wall-h i{width:16px;height:10px;}
.wall-v{top:56px;bottom:56px;flex-direction:column;align-items:center;}
.wall-v.left{left:40px;}
.wall-v.right{right:40px;}
.wall-v i{width:10px;height:16px;}
/* 桌心方位水印 */
.watermark{
  position:absolute;inset:0;
  display:grid;place-items:center;
  font:700 72px/1 var(--serif);
  color:rgba(237,230,216,.07);
  user-select:none;pointer-events:none;
  transition:opacity .18s ease;
}
/* 四座牌位 */
.seat{
  position:absolute;z-index:2;
  width:64px;height:46px;
  border-radius:12px;
  background:var(--ink-600);
  border:2px solid rgba(237,230,216,.13);
  color:var(--muted);
  font:700 26px/1 var(--serif);
  display:grid;place-items:center;
  padding:0;cursor:pointer;
  box-shadow:0 2px 0 rgba(0,0,0,.5);
  transition:border-color .18s,box-shadow .18s,color .18s,background .18s,filter .1s;
}
.seat.n{top:0;left:50%;transform:translate(-50%,-50%);}
.seat.e{right:0;top:50%;transform:translate(50%,-50%);}
.seat.s{bottom:0;left:50%;transform:translate(-50%,50%);}
.seat.w{left:0;top:50%;transform:translate(-50%,-50%);}
.seat:hover{
  background:oklch(from var(--ink-600) calc(l + 0.06) c h);
  border-color:rgba(237,230,216,.3);
}
.seat.on{
  background:oklch(from var(--ink-600) calc(l + 0.03) c h);
  border-color:var(--brass);
  color:var(--brass);
  box-shadow:0 2px 0 rgba(0,0,0,.5),0 0 14px rgba(201,162,75,.22);
}
.seat.on:hover{border-color:oklch(from var(--brass) calc(l + 0.06) c h);}
.seat:active{filter:brightness(1.14);}
.seat:focus-visible{outline:2px solid var(--brass);outline-offset:3px;}

/* ── 骨白信息卡 ────────────────────────────── */
.card{
  flex:none;position:relative;z-index:3;
  background:var(--tile);
  border-radius:14px;
  box-shadow:var(--tile-shadow);
  color:var(--jet);
  overflow:hidden;
  margin-top:2px;
}
.card-strip{
  height:16px;
  background-color:oklch(from var(--tile) calc(l - 0.03) c h);
  background-image:
    repeating-linear-gradient(45deg,rgba(42,39,34,.05) 0 1px,transparent 1px 5px),
    repeating-linear-gradient(-45deg,rgba(42,39,34,.05) 0 1px,transparent 1px 5px);
  border-bottom:1px solid rgba(42,39,34,.09);
}
.card-body{position:relative;padding:14px 14px 16px;}
.card-head{
  display:flex;align-items:baseline;justify-content:space-between;gap:8px;
}
.card-head h2{
  font:700 18px/1.3 var(--serif);
  letter-spacing:.02em;color:var(--jet);
}
.card-head .lat{
  font:600 11px/1 var(--num);
  letter-spacing:.14em;
  color:rgba(42,39,34,.68);
}
.tags{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.tag{
  font:500 13px/1 var(--sans);
  padding:6px 10px;border-radius:999px;
  background:rgba(42,39,34,.055);
  border:1px solid rgba(42,39,34,.09);
  color:rgba(42,39,34,.78);
  white-space:nowrap;
}
.tag b{font-weight:600;color:var(--red-deep);}
.ck-label{
  margin-top:12px;
  font:500 11px/1 var(--sans);
  color:rgba(42,39,34,.68);
}
.ck{
  list-style:none;margin-top:8px;
  display:grid;grid-template-columns:1fr 1fr;
  gap:8px 12px;
}
.ck li{
  display:flex;align-items:center;gap:7px;
  font:400 13px/1.35 var(--sans);
  color:rgba(42,39,34,.88);
}
.ck svg{flex:none;width:14px;height:14px;color:var(--jade);}
.seal{
  position:absolute;right:12px;bottom:12px;
  width:24px;height:24px;
  background:var(--vermillion);
  border-radius:5px;
  display:grid;place-items:center;
  font:700 13px/1 var(--serif);
  color:var(--tile);
  opacity:.92;
  transform:rotate(-5deg);
  user-select:none;
}
@keyframes card-in{from{opacity:.4;transform:translateY(4px);}to{opacity:1;transform:none;}}
.card-body.swap{animation:card-in .22s ease;}

/* ── 拇指区 CTA ────────────────────────────── */
.cta{flex:none;padding:14px 0 0;}
.cta-row{display:flex;gap:12px;}
.btn{
  height:50px;border-radius:999px;border:0;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--sans);cursor:pointer;
  transition:background .15s,border-color .15s,box-shadow .15s,filter .1s;
}
.btn:active{filter:brightness(.97);}
.btn:focus-visible{outline:2px solid var(--brass);outline-offset:3px;}
.btn-primary{
  flex:1;background:var(--tile);color:var(--jet);
  font:500 18px/1 var(--sans);
  box-shadow:var(--tile-shadow);
}
.btn-primary:hover{background:oklch(from var(--tile) calc(l - 0.06) c h);}
.btn-primary:active{background:oklch(from var(--tile) calc(l - 0.1) c h);}
.btn-primary:focus-visible{outline-color:var(--jet);}
.btn-ghost{
  width:96px;background:transparent;color:var(--fg);
  border:1.5px solid rgba(237,230,216,.3);
  font:500 15px/1 var(--sans);
}
.btn-ghost:hover{
  background:rgba(237,230,216,.08);
  border-color:rgba(237,230,216,.46);
}
.btn-ghost:active{background:rgba(237,230,216,.12);}
.cta-caption{
  margin-top:10px;text-align:center;
  font:400 13px/1.4 var(--sans);
  color:var(--muted);
}
.cta-caption b{font-weight:500;color:var(--fg);}
.cta-caption .num{
  font:600 13px/1 var(--num);
  color:var(--brass);letter-spacing:.04em;
}

/* ── 底部免责条 ────────────────────────────── */
.disclaimer{flex:none;padding:12px 20px 0;}
.disclaimer p{
  font:400 11px/1.5 var(--sans);
  color:var(--muted);
}
.disclaimer p+p{margin-top:2px;}
.home-bar{
  width:134px;height:5px;border-radius:999px;
  background:rgba(237,230,216,.32);
  margin:12px auto 8px;
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important;}
}
</style>
</head>
<body>

<div class="screen" data-od-id="screen">

  <!-- 状态栏 -->
  <div class="statusbar" data-od-id="status-bar">
    <span class="time">9:41</span>
    <span class="sys" aria-hidden="true">
      <svg width="18" height="11" viewBox="0 0 18 11" fill="currentColor"><rect x="0" y="7.5" width="3.2" height="3.5" rx="1"/><rect x="4.9" y="5.4" width="3.2" height="5.6" rx="1"/><rect x="9.8" y="2.9" width="3.2" height="8.1" rx="1"/><rect x="14.7" y="0" width="3.2" height="11" rx="1"/></svg>
      <svg width="16" height="11" viewBox="0 0 16 11" fill="none"><path d="M1.2 3.4a10.2 10.2 0 0 1 13.6 0" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M3.7 6.1a6.6 6.6 0 0 1 8.6 0" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="8" cy="9.2" r="1.5" fill="currentColor"/></svg>
      <svg width="25" height="11" viewBox="0 0 25 11"><rect x=".6" y=".6" width="20.8" height="9.8" rx="2.8" fill="none" stroke="currentColor" stroke-opacity=".38" stroke-width="1.1"/><rect x="2.2" y="2.2" width="14.5" height="6.6" rx="1.6" fill="currentColor"/><path d="M23.2 3.7v3.6c.9-.3 1.4-1 1.4-1.8s-.5-1.5-1.4-1.8Z" fill="currentColor" fill-opacity=".38"/></svg>
    </span>
  </div>

  <!-- 顶栏 -->
  <header class="nav" data-od-id="nav-header">
    <button class="nav-back" type="button" data-od-id="nav-back" aria-label="返回">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>
    </button>
    <div class="nav-titles">
      <h1 data-od-id="nav-title">座位模拟器</h1>
      <p data-od-id="nav-caption">趣味方位参考 · 仅供娱乐</p>
    </div>
    <div class="capsule" data-od-id="nav-capsule" aria-hidden="true">
      <span class="cap-half"><span class="dots"><i></i><i></i><i></i></span></span>
      <span class="cap-sep"></span>
      <span class="cap-half"><svg width="15" height="15" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.2" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="8" r="1.7" fill="currentColor"/></svg></span>
    </div>
  </header>

  <!-- 主内容 -->
  <main class="main">

    <!-- 俯视麻将桌 -->
    <section class="hero" data-od-id="table-hero" aria-label="俯视麻将桌，点选座位">
      <div class="table">
        <div class="felt">
          <div class="wall wall-h top" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
          <div class="wall wall-h bottom" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
          <div class="wall wall-v left" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
          <div class="wall wall-v right" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
          <div class="watermark" id="watermark" aria-hidden="true">东</div>
        </div>
        <button class="seat n" type="button" data-od-id="seat-north" data-key="n" aria-pressed="false" aria-label="选择北座">北</button>
        <button class="seat e" type="button" data-od-id="seat-east" data-key="e" aria-pressed="true" aria-label="选择东座">东</button>
        <button class="seat s" type="button" data-od-id="seat-south" data-key="s" aria-pressed="false" aria-label="选择南座">南</button>
        <button class="seat w" type="button" data-od-id="seat-west" data-key="w" aria-pressed="false" aria-label="选择西座">西</button>
      </div>
    </section>

    <!-- 座位信息卡 -->
    <section class="card" data-od-id="info-card" aria-label="选中座位信息">
      <div class="card-strip" aria-hidden="true"></div>
      <div class="card-body" id="cardBody">
        <div class="card-head">
          <h2 id="cardTitle" data-od-id="info-title">东座</h2>
          <span class="lat" id="cardLat">EAST</span>
        </div>
        <div class="tags" data-od-id="info-tags">
          <span class="tag" id="tag1"><b>木</b> · 背有靠</span>
          <span class="tag" id="tag2">晨光温和</span>
        </div>
        <p class="ck-label">环境自检</p>
        <ul class="ck" data-od-id="checklist">
          <li><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.4 7.4 5.6 10.6 11.6 3.8"/></svg>座椅有靠背</li>
          <li><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.4 7.4 5.6 10.6 11.6 3.8"/></svg>桌面光线均匀</li>
          <li><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.4 7.4 5.6 10.6 11.6 3.8"/></svg>背后无走道</li>
          <li><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.4 7.4 5.6 10.6 11.6 3.8"/></svg>起身无遮挡</li>
        </ul>
        <span class="seal" aria-hidden="true">中</span>
      </div>
    </section>

    <!-- 拇指区 -->
    <section class="cta" aria-label="操作">
      <div class="cta-row">
        <button class="btn btn-primary" type="button" id="btnNext" data-od-id="cta-primary">换个座位</button>
        <button class="btn btn-ghost" type="button" id="btnReset" data-od-id="cta-reset">重置</button>
      </div>
      <p class="cta-caption" id="ctaCaption" data-od-id="cta-caption" aria-live="polite">已选 <b id="capSeat">东座</b> · 环境自检 <span class="num">4/4</span></p>
    </section>

  </main>

  <!-- 底部免责条 -->
  <footer class="disclaimer" data-od-id="disclaimer">
    <p>提示：本趣味方位参考仅传统民俗娱乐，无科学依据，和记账理财无关，不构成任何决策建议。棋牌请理性游玩，严禁赌博。</p>
    <p>本工具仅民俗趣味参考，和资金收支、投资没有任何关联。</p>
    <div class="home-bar" aria-hidden="true"></div>
  </footer>

</div>

<script>
(function(){
  var SEATS=[
    {key:'e',char:'东',name:'东座',lat:'EAST',el:'木',d1:'背有靠',d2:'晨光温和'},
    {key:'s',char:'南',name:'南座',lat:'SOUTH',el:'火',d1:'靠明窗',d2:'采光充足'},
    {key:'w',char:'西',name:'西座',lat:'WEST',el:'金',d1:'靠实墙',d2:'无直射光'},
    {key:'n',char:'北',name:'北座',lat:'NORTH',el:'水',d1:'避风口',d2:'安静少扰'}
  ];
  var order=['e','s','w','n'];
  var seats=Array.prototype.slice.call(document.querySelectorAll('.seat'));
  var h2=document.getElementById('cardTitle');
  var lat=document.getElementById('cardLat');
  var t1=document.getElementById('tag1');
  var t2=document.getElementById('tag2');
  var wm=document.getElementById('watermark');
  var cap=document.getElementById('capSeat');
  var body=document.getElementById('cardBody');
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var idx=0;

  function render(animate){
    var s=SEATS[idx];
    seats.forEach(function(b){
      var on=b.getAttribute('data-key')===s.key;
      b.classList.toggle('on',on);
      b.setAttribute('aria-pressed',on?'true':'false');
    });
    h2.textContent=s.name;
    lat.textContent=s.lat;
    t1.innerHTML='';
    var em=document.createElement('b');
    em.textContent=s.el;
    t1.appendChild(em);
    t1.appendChild(document.createTextNode(' · '+s.d1));
    t2.textContent=s.d2;
    cap.textContent=s.name;
    if(wm.textContent!==s.char){
      if(reduce){wm.textContent=s.char;}
      else{
        wm.style.opacity='0';
        setTimeout(function(){wm.textContent=s.char;wm.style.opacity='';},140);
      }
    }
    if(animate&&!reduce){
      body.classList.remove('swap');
      void body.offsetWidth;
      body.classList.add('swap');
    }
    try{localStorage.setItem('seat-sim',s.key);}catch(e){}
  }

  seats.forEach(function(b){
    b.addEventListener('click',function(){
      var k=b.getAttribute('data-key');
      var j=-1;
      for(var i=0;i<SEATS.length;i++){if(SEATS[i].key===k){j=i;break;}}
      if(j>=0&&j!==idx){idx=j;render(true);}
    });
  });

  document.getElementById('btnNext').addEventListener('click',function(){
    var cur=SEATS[idx].key;
    var n=order[(order.indexOf(cur)+1)%4];
    for(var i=0;i<SEATS.length;i++){if(SEATS[i].key===n){idx=i;break;}}
    render(true);
  });

  document.getElementById('btnReset').addEventListener('click',function(){
    if(idx!==0){idx=0;render(true);}
  });

  try{
    var saved=localStorage.getItem('seat-sim');
    if(saved){
      for(var i=0;i<SEATS.length;i++){
        if(SEATS[i].key===saved){idx=i;break;}
      }
    }
  }catch(e){}
  render(false);
})();
</script>

</body>
</html>
