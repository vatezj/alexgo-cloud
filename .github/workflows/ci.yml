name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Add GOPATH/bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Download dependencies
        run: go mod download

      - name: Lint
        uses: golangci/golangci-lint-action@v6

      - name: Generate proto
        run: make generate-all

      - name: Test
        run: go test ./... -v -race

      - name: Build
        run: make build

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.0

      - name: Helm lint
        run: helm lint deployments/helm/alexgo-cloud

      - name: Docker build (dry-run)
        run: docker build -f alexgo-server/Dockerfile -t alexgo-cloud:test .

