name: CD Pipeline

on:
  push:
    tags: ["v*"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: alexgo-server/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_REGISTRY }}/alexgo-cloud:${{ github.ref_name }}

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.0

      - name: Configure kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBECONFIG_B64" | base64 -d > "$HOME/.kube/config"

      - name: Deploy with Helm
        run: |
          helm upgrade --install alexgo-cloud deployments/helm/alexgo-cloud \
            --namespace alexgo-prod --create-namespace \
            --set image.repository=${{ secrets.DOCKER_REGISTRY }}/alexgo-cloud \
            --set image.tag=${{ github.ref_name }}

