apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: alexgo-hpa
  namespace: alexgo-cloud
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: alexgo-server
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60

