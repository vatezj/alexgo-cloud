apiVersion: v1
kind: Service
metadata:
  name: alexgo-server
  namespace: alexgo-cloud
spec:
  selector:
    app: alexgo-server
  ports:
    # 多端口必须逐个命名（K8s 校验）：http=业务端口，grpc=TokenService（member 拨 50051）
    - name: http
      port: 8080
      targetPort: 8080
    - name: grpc
      port: 50051
      targetPort: 50051
  type: ClusterIP

