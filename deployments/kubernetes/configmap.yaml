apiVersion: v1
kind: ConfigMap
metadata:
  name: alexgo-config
  namespace: alexgo-cloud
data:
  # 顶层 DB_DSN（明文死变量）已移除：DB_DSN 改由 Secret alexgo-secrets 以 env（secretKeyRef）注入，
  # 见 deployment.yaml；ConfigMap 不是密钥的正确载体。
  HTTP_ADDR: ":8080"
  config.yaml: |
    server:
      http_addr: ":8080"
    database:
      # dsn 兜底占位值（非真实密码）：生产必须由环境变量 DB_DSN（Secret alexgo-secrets）覆盖，
      # 见 deployment.yaml env secretKeyRef；未覆盖时 readiness 探活会失败。
      dsn: "root:change-me@tcp(mysql.alexgo-cloud.svc.cluster.local:3306)/alexgo?charset=utf8mb4&parseTime=True&loc=Local"
    migrate:
      auto: true
    microservice:
      enabled: false
      registry: "consul://127.0.0.1:8500"
    modules:
      system: true
      order: true

