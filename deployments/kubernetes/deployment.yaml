apiVersion: apps/v1
kind: Deployment
metadata:
  name: alexgo-server
  namespace: alexgo-cloud
  labels:
    app: alexgo-server
spec:
  replicas: 3
  selector:
    matchLabels:
      app: alexgo-server
  template:
    metadata:
      labels:
        app: alexgo-server
    spec:
      containers:
        - name: alexgo-server
          image: alexgo-cloud:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: alexgo-config
          volumeMounts:
            - name: alexgo-config
              mountPath: /app/alexgo-server/configs
              readOnly: true
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: alexgo-config
          configMap:
            name: alexgo-config
            items:
              - key: config.yaml
                path: config.yaml

