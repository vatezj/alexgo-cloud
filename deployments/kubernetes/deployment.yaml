apiVersion: apps/v1
kind: Deployment
metadata:
  name: alexgo-server
  namespace: alexgo-cloud
  labels:
    app: alexgo-server
spec:
  replicas: 3
  selector:
    matchLabels:
      app: alexgo-server
  template:
    metadata:
      labels:
        app: alexgo-server
    spec:
      containers:
        - name: alexgo-server
          image: alexgo-cloud:latest
          ports:
            - name: http
              containerPort: 8080
            # TokenService gRPC（仅 micro 模式监听，StartGRPCServer 按 deployment.mode 门控）
            - name: grpc
              containerPort: 50051
          envFrom:
            - configMapRef:
                name: alexgo-config
          env:
            - name: DB_DSN
              valueFrom:
                secretKeyRef:
                  name: alexgo-secrets
                  key: DB_DSN
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: alexgo-secrets
                  key: JWT_SECRET
            # micro 形态：本进程只装 system+order，member 路由由 alexgo-member 承载（spec §2.5）
            - name: DEPLOYMENT_MODE
              value: "micro"
          volumeMounts:
            - name: alexgo-config
              mountPath: /app/alexgo-server/configs
              readOnly: true
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: alexgo-config
          configMap:
            name: alexgo-config
            items:
              - key: config.yaml
                path: config.yaml

