replicaCount: 2

# 灰度与 system 同倍数
deployment:
  mode: micro   # 双服务形态（system :8080 + member :8081，前缀分流，spec §2.5）

member:
  replicaCount: 2

image:
  tag: "gray-latest"

ingress:
  enabled: true
  host: alexgo-gray.example.com

# 密钥：部署时通过 --set / 外部密钥系统注入（Sealed Secrets / External Secrets），勿写进本文件提交 git。
# 留空则不创建 Secret，回退 config.yaml 兜底（不推荐用于生产）。
secrets:
  dbDsn: ""
  jwtSecret: ""

