replicaCount: 1

# dev 资源最省：member 单副本即可联调前缀分流
deployment:
  mode: micro   # 双服务形态（system :8080 + member :8081，前缀分流，spec §2.5）

member:
  replicaCount: 1

image:
  tag: "dev-latest"

config:
  server:
    pprofEnabled: true
  database:
    dsn: "root:password@tcp(mysql-dev:3306)/alexgo_dev?charset=utf8mb4&parseTime=True&loc=Local"
  modules:
    system: true
    order: true

ingress:
  enabled: true
  host: alexgo-dev.example.com

autoscaling:
  enabled: false

# 密钥：dev 仅用 change-me 占位值方便本地联调；真实值部署时注入，勿提交真实密码进 git。
# 留空则不创建 Secret，回退 config.yaml 兜底。
secrets:
  dbDsn: "root:change-me@tcp(mysql-dev:3306)/alexgo_dev?charset=utf8mb4&parseTime=True&loc=Local"
  jwtSecret: "change-me"

