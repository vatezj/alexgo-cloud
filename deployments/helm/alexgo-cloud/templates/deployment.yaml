apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "alexgo-cloud.fullname" . }}
  labels:
    app: {{ include "alexgo-cloud.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "alexgo-cloud.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "alexgo-cloud.fullname" . }}
    spec:
      containers:
        - name: alexgo-server
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
            # TokenService gRPC（仅 micro 模式监听，StartGRPCServer 按 deployment.mode 门控）
            - name: grpc
              containerPort: 50051
          env:
            - name: DB_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "alexgo-cloud.fullname" . }}-secrets
                  key: DB_DSN
                  optional: true
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "alexgo-cloud.fullname" . }}-secrets
                  key: JWT_SECRET
                  optional: true
            # micro 形态：本进程只装 system+order，member 路由由 -member deployment 承载（spec §2.5）
            - name: DEPLOYMENT_MODE
              value: "micro"
          volumeMounts:
            - name: config
              mountPath: /app/alexgo-server/configs
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: {{ .Values.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: config
          configMap:
            name: {{ include "alexgo-cloud.fullname" . }}-config
            items:
              - key: config.yaml
                path: config.yaml
