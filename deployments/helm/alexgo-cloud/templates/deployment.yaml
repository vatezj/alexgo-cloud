apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "alexgo-cloud.fullname" . }}
  labels:
    app: {{ include "alexgo-cloud.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "alexgo-cloud.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "alexgo-cloud.fullname" . }}
    spec:
      containers:
        - name: alexgo-server
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          volumeMounts:
            - name: config
              mountPath: /app/alexgo-server/configs
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: {{ .Values.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: {{ include "alexgo-cloud.fullname" . }}-config
            items:
              - key: config.yaml
                path: config.yaml
