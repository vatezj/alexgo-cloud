apiVersion: v1
kind: Service
metadata:
  name: {{ include "alexgo-cloud.fullname" . }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ include "alexgo-cloud.fullname" . }}
  ports:
    # 多端口必须逐个命名（K8s 校验）：http=业务端口，grpc=TokenService（member 拨 50051）
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
    - name: grpc
      port: 50051
      targetPort: 50051
