apiVersion: v1
kind: Service
metadata:
  # 对外沿用 .Values.service.port（8080）→ targetPort 8081，ingress 的 member 后端走此服务
  name: {{ include "alexgo-cloud.fullname" . }}-member
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ include "alexgo-cloud.fullname" . }}-member
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8081
