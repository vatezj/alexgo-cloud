replicaCount: 5

# 双服务形态（system :8080 + member :8081，前缀分流，spec §2.5）
deployment:
  mode: micro

# member-server 生产副本（system 的 member 对偶资源）
member:
  replicaCount: 3

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "800m"
    memory: "1Gi"

config:
  database:
    # 兜底占位值（非真实密码）：生产部署必须通过下方 secrets.dbDsn 注入真实 DSN，否则 readiness 探活会失败。
    dsn: "root:change-me@tcp(mysql-prod:3306)/alexgo?charset=utf8mb4&parseTime=True&loc=Local"
  modules:
    system: true
    order: true

ingress:
  enabled: true
  host: alexgo.example.com

# 密钥：部署时通过 --set / 外部密钥系统注入（Sealed Secrets / External Secrets），勿写进本文件提交 git。
# 留空则不创建 Secret，回退 config.yaml 兜底（不推荐用于生产）。
secrets:
  dbDsn: ""
  jwtSecret: ""

