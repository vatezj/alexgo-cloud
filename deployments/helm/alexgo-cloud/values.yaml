replicaCount: 3

image:
  repository: alexgo-cloud
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

# 部署形态（spec §2.5）：micro = 双服务（system :8080 + member :8081，路径前缀分流）；
# 本地/单机演示可覆盖为 mono（单进程全模块，vite 不分流）。
deployment:
  mode: micro   # 本地/单机演示可改 mono

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 800m
    memory: 1Gi

# member-server（micro 形态的会员侧服务，:8081，command=/app/member-server）
member:
  replicaCount: 2
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 400m
      memory: 512Mi

config:
  server:
    httpAddr: ":8080"
    grpcAddr: ":50051"
    pprofEnabled: false
  database:
    # 兜底占位值（非真实密码）：生产必须通过 secrets.dbDsn（Secret env）覆盖，
    # 环境变量 DB_DSN 经 applyEnvOverrides 压过本文件。
    dsn: "root:change-me@tcp(mysql:3306)/alexgo?charset=utf8mb4&parseTime=True&loc=Local"
  migrate:
    auto: true
  microservice:
    enabled: false
    registry: "consul://127.0.0.1:8500"
  mq:
    nats:
      enabled: false
      url: "nats://127.0.0.1:4222"
      stream: "ALEXGO"
      subjectPrefix: "alexgo.>"
  outbox:
    enabled: true
    intervalSecond: 5
    batchSize: 100
  redis:
    enabled: false
    addr: "127.0.0.1:6379"
    password: ""
    db: 0
  limiter:
    enabled: false
    rate: 100
    burst: 200
  breaker:
    enabled: false
    threshold: 10
    openSecond: 30
  system:
    # 兜底占位值（非真实密钥）：生产必须通过 secrets.jwtSecret（Secret env JWT_SECRET）覆盖。
    jwtSecret: "change-me"
    defaultAdminRole: "admin"
    defaultAdminUsername: "admin"
    defaultAdminPassword: "admin123"
  modules:
    system: true
    order: true

ingress:
  enabled: true
  host: alexgo.example.com
  className: nginx

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 65

# 密钥：强烈建议部署时通过 --set / -f <外部密钥文件> / Sealed Secrets 注入，
# 不要把真实值写进本文件提交 git。留空则不创建 Secret，回退 config.yaml 兜底（不推荐用于生产）。
secrets:
  dbDsn: ""
  jwtSecret: ""
